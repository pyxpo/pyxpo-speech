[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyxpo-speech"
dynamic = ["version"]
description = "Offline speech to text for pyxpo apps: the microphone and whisper.cpp on the phone, nothing sent anywhere."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vishal Chaubey" }]
keywords = ["pyxpo", "pyxpo-module", "mobile", "android", "speech", "speech-to-text", "stt", "whisper", "whisper.cpp", "offline", "voice", "microphone"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Android",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = ["pyxpo>=0.1.0a2,<0.2"]

[project.urls]
Homepage = "https://github.com/pyxpo/pyxpo/tree/main/packages/speech"
Documentation = "https://github.com/pyxpo/pyxpo/blob/main/packages/speech/README.md"
Changelog = "https://github.com/pyxpo/pyxpo/blob/main/packages/speech/CHANGELOG.md"
Source = "https://github.com/pyxpo/pyxpo/tree/main/packages/speech"
Issues = "https://github.com/pyxpo/pyxpo/issues"

# How `pyxpo build` finds this module: the entry point name is the module name apps list in
# `[tool.pyxpo] modules`, its value the import package holding pyxpo-module.json.
[project.entry-points."pyxpo.modules"]
speech = "pyxpo_speech"

[tool.setuptools]
packages = ["pyxpo_speech"]

[tool.setuptools.dynamic]
version = { attr = "pyxpo_speech.__version__" }

[tool.setuptools.package-data]
pyxpo_speech = ["pyxpo-module.json", "py.typed", "android/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__", "*.pyc", ".DS_Store"]
